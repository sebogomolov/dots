# Refer to https://wiki.hypr.land/Configuring/Variables/
# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 1
    gaps_out = 4
    border_size = 1
    col.active_border = rgb(504945)
    col.inactive_border = rgba(28282800)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

dwindle {
    preserve_split = true # важно для сохранения структуры при закрытии окон
    force_split = 2 # 0 -> за мышкой, 1 -> всегда слева/сверху, 2 -> всегда справа/снизу
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 16
    rounding_power = 8

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 2
        color = rgb(1d2021)
        color_inactive = rgba(28282800)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 3
        vibrancy = 0.1696
    }
}
